# CI du générateur. Elle ne délègue PAS au réutilisable de la famille : celui-ci
# suppose une PWA — build Vite, budget de poids, pwa-doctor. Ce dépôt n'a ni
# build ni dépendance au socle, et c'est sa propriété principale : il doit
# s'installer là où aucun `.npmrc` n'existe encore.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Lire le socle sur GitHub Packages, pour construire l'application engendrée.
  packages: read

jobs:
  validate:
    name: Format et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm test

  # LA VRAIE PREUVE : le générateur tire le squelette RÉEL et en sort une
  # application. Les tests unitaires éprouvent la substitution sur un faux
  # squelette ; ce job éprouve l'accord entre les deux dépôts — c'est lui qui
  # rougit le jour où le squelette change de forme.
  engendrer:
    name: Engendrer une application depuis le squelette
    runs-on: ubuntu-latest
    env:
      # Deux apostrophes droites : la chaîne passe entre guillemets doubles dans
      # le dictionnaire, ce que la vérification de Prettier ci-dessous éprouve.
      # 87 caractères : le générateur refuse une description de moins de 70.
      DESCRIPTION: "L'application d'essai de la CI, engendrée à chaque poussée pour éprouver le générateur."
      # 59 caractères : au-dessus des 50 de la règle, et assez court pour tenir
      # sur la ligne de `<title>`, ce que le compte ci-dessous suppose.
      TITRE: "Miss Essai Ci - l'application d'essai que la CI fait naître"
      # Un nom long et un titre qui se replie, pour la naissance depuis `main`.
      NOM_LONG: 'Mister Une Application Au Nom Vraiment Long'
      TITRE_LONG: 'Mister Une Application Au Nom Vraiment Long - le titre qui se replie sur deux lignes'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'

      - name: Engendrer
        run: node bin/create-lg-pwa-app.mjs miss-essai-ci --no-install --dir /tmp/engendree --titre "$TITRE" --description "$DESCRIPTION"

      # Le README cite le squelette comme ORIGINE, en lien : c'est voulu, et
      # c'est la seule occurrence tolérée.
      - name: Aucune trace du squelette, et l'identité posée partout
        run: |
          reste=$(grep -rIl 'pwa-starter-kit' /tmp/engendree \
            --exclude-dir=.git --exclude=README.md || true)
          if [ -n "$reste" ]; then
            echo "::error::le nom du squelette subsiste dans : $reste"
            exit 1
          fi
          # Le nom COURT aussi : c'est l'étiquette de l'icône installée.
          reste=$(grep -rIl 'Starter Kit' /tmp/engendree \
            --exclude-dir=.git --exclude=README.md || true)
          if [ -n "$reste" ]; then
            echo "::error::le nom court du squelette subsiste dans : $reste"
            exit 1
          fi
          grep -q '"name": "miss-essai-ci"' /tmp/engendree/package.json
          grep -q "APP_ID = 'miss-essai-ci'" /tmp/engendree/vite.config.ts
          grep -q "APP_ID = 'miss-essai-ci'" /tmp/engendree/src/app/links.ts
          echo "✅ identité substituée, README réécrit"

      # Le générateur ÉCHOUE si une phrase du squelette subsiste, mais il ne
      # fait qu'AVERTIR quand une place manque : le squelette a pu la retirer
      # à dessein. Ici, les comptes sont ceux du squelette d'aujourd'hui — deux
      # balises meta, deux phrases dans deux langues, le titre et sa copie
      # og:title — et c'est ce job qui rougit le jour où l'une d'elles change
      # de place.
      - name: La description et le titre posés à chacune de leurs places
        working-directory: /tmp/engendree
        run: |
          attendu() {
            n=$(grep -c -F -- "$2" "$1" || true)
            if [ "$n" -ne "$3" ]; then
              echo "::error::$1 : « $2 » $n fois, $3 attendues"
              exit 1
            fi
          }
          attendu index.html "$DESCRIPTION" 2
          attendu src/i18n/messages.ts "$DESCRIPTION" 4
          attendu src/i18n/messages.ts 'TODO traduire' 2
          attendu index.html "$TITRE" 2
          echo "✅ meta description, og:description, app.tagline, about.what, <title> et og:title"

      # LA PREUVE QUI MANQUAIT : l'application engendrée — pas le squelette —
      # s'installe, se construit, passe le budget de poids et `pwa-doctor
      # --strict`. `npm ci` lit le lockfile du squelette, écrit par npm 10 ;
      # le socle vient de GitHub Packages, que `GITHUB_TOKEN` sait lire.
      - name: Construire l'application engendrée
        working-directory: /tmp/engendree
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # `--no-install` saute l'écriture de `.claude/launch.json` : l'arbre garde
      # celui du squelette, et le contrôle qui suit ne voyait jamais celui du
      # générateur. La première CI de miss-devises a rougi pour lui seul
      # (01/10/2026). Écrit ici par la même fonction, il passe par le Prettier
      # et la configuration de l'application.
      - name: Le launch.json du générateur, à sa place dans l'arbre
        run: |
          mkdir -p /tmp/engendree/.claude
          node --input-type=module -e "
            import { launchJson } from './bin/scaffold.mjs';
            process.stdout.write(launchJson('miss-essai-ci', 5299));
          " > /tmp/engendree/.claude/launch.json

      # La première CI de l'application joue `format:check`, sur TOUT l'arbre.
      # Un nom ou une phrase d'une autre longueur change une mise en page — une
      # ligne qui tient ou non, un tableau Markdown désaligné. Vérifier les
      # seuls fichiers qu'on croit touchés a laissé passer l'ADR 0012 : on
      # joue donc ici la commande de l'application elle-même.
      - name: L'application engendrée passe son propre format:check
        working-directory: /tmp/engendree
        run: npm run format:check

      # LA POINTE DE `main` AUSSI. Le générateur tire la dernière ÉTIQUETTE du
      # squelette : ce qui a été ajouté depuis n'est éprouvé nulle part avant la
      # prochaine, et c'est ainsi que l'ADR 0012 aurait fait naître des apps
      # rouges sans que rien ne l'annonce. Engendrées sans installation, ces
      # apps passent par le Prettier et la configuration de la première.
      #
      # DEUX NAISSANCES, PAS UNE. La longueur du nom change la mise en page :
      # un `<title>` qui se replie au-delà de 61 caractères, un appel de
      # `e2e/smoke.spec.ts` qui se referme sous sept. Un nom court avec les
      # textes par défaut, un nom long avec un titre qui se replie.
      - name: Depuis la pointe de main, les arbres engendrés passent Prettier
        run: |
          node bin/create-lg-pwa-app.mjs miss-essai-ci --no-install --from main \
            --nom 'Miss X' --dir /tmp/depuis-main
          node bin/create-lg-pwa-app.mjs miss-essai-ci --no-install --from main \
            --nom "$NOM_LONG" --titre "$TITRE_LONG" --description "$DESCRIPTION" \
            --dir /tmp/depuis-main-long
          for arbre in /tmp/depuis-main /tmp/depuis-main-long; do
            (cd "$arbre" && /tmp/engendree/node_modules/.bin/prettier \
              --config /tmp/engendree/prettier.config.js --check .)
          done
          # Depuis pwa-starter-kit#67, l'accueil porte l'accroche : le README
          # engendré doit dire de la garder, pas de supprimer l'écran.
          if ! grep -q "l'accroche \`app.tagline\`" /tmp/depuis-main/README.md; then
            echo "::error::README.md : l'accroche de l'accueil n'est pas dite à garder"
            exit 1
          fi
          # Le squelette de main passe `shortName` : c'est le nom qu'Android
          # affiche sous l'icône. miss-devises en est née « Starter Kit ».
          if ! grep -q "shortName: 'Miss X'" /tmp/depuis-main/vite.config.ts; then
            echo "::error::vite.config.ts : le nom court n'est pas celui de l'application"
            exit 1
          fi
          # Depuis pwa-starter-kit#81, le manifeste se décrit aussi : c'est la
          # phrase de l'application qu'il doit porter, pas celle du squelette.
          if ! grep -qF "$DESCRIPTION" /tmp/depuis-main-long/vite.config.ts; then
            echo "::error::vite.config.ts : la description du manifeste n'est pas celle de l'application"
            exit 1
          fi

      # LES RÈGLES SEO DU SOCLE, PAR SA PROPRE CONSTRUCTION. Depuis le socle
      # 6.21, `pwa-doctor --strict` refuse un titre de moins de 50 caractères
      # et une description de moins de 70 ; l'étiquette du squelette, en socle
      # 4, ne les connaît pas. C'est donc la pointe, avec un nom de six
      # caractères et les textes par défaut, qui prouve qu'ils passent.
      - name: Depuis la pointe de main, les textes par défaut passent pwa-doctor --strict
        working-directory: /tmp/depuis-main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
